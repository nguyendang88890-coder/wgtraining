name: Deploy

on:
  push:
    branches: [main]

jobs:
  guard:
    name: Safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Blocks the deploy if a change reopens a known security hole (see .github/scripts/guard.js).
      - run: node .github/scripts/guard.js

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    # Optional: move the VPS_* secrets into a GitHub Environment named "production"
    # (restricted to the main branch) so other branches can never read them.
    environment: production
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The VPS key is restricted to a forced command
          # (/usr/local/bin/deploy-training.sh): it pulls the repo kept OUTSIDE the
          # web root, then rsyncs only the site files into the docroot, so .git and
          # repo-internal files are never served. Whatever command is sent here is
          # ignored server-side - kept for clarity.
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/usr/local/bin/deploy-training.sh"
